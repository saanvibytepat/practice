<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Saanvi's personal landing page">
  <title>Saanvi | Welcome</title>
  <style>
    :root {
      --ink: #192038;
      --muted: #626b86;
      --cream: #fffaf3;
      --lavender: #e9e5ff;
      --peach: #ffd8c7;
      --accent: #7564d9;
      --white: rgba(255, 255, 255, 0.74);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 12% 18%, var(--peach) 0, transparent 28%),
        radial-gradient(circle at 88% 82%, var(--lavender) 0, transparent 34%),
        var(--cream);
    }

    .card {
      position: relative;
      width: min(100%, 920px);
      min-height: 560px;
      display: flex;
      align-items: center;
      overflow: hidden;
      padding: clamp(2rem, 6vw, 5.5rem);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 32px;
      background: var(--white);
      box-shadow: 0 24px 70px rgba(74, 59, 133, 0.16);
      backdrop-filter: blur(16px);
    }

    .card::before,
    .card::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }

    .card::before {
      width: 230px;
      height: 230px;
      right: -75px;
      top: -80px;
      background: var(--peach);
      opacity: 0.62;
    }

    .card::after {
      width: 160px;
      height: 160px;
      left: -65px;
      bottom: -70px;
      background: var(--lavender);
    }

    .content {
      position: relative;
      z-index: 1;
      max-width: 620px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      margin-bottom: 1.5rem;
      color: var(--accent);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 28px;
      height: 2px;
      border-radius: 999px;
      background: var(--accent);
    }

    h1 {
      max-width: 650px;
      font-size: clamp(3.5rem, 10vw, 7.4rem);
      line-height: 0.9;
      letter-spacing: -0.08em;
    }

    h1 span {
      color: var(--accent);
    }

    .intro {
      max-width: 480px;
      margin-top: 1.8rem;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.18rem);
      line-height: 1.7;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem;
      margin-top: 2.2rem;
    }

    .button {
      display: inline-block;
      padding: 0.9rem 1.25rem;
      border: 1px solid var(--accent);
      border-radius: 999px;
      color: var(--white);
      background: var(--accent);
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
      transition: transform 180ms ease, box-shadow 180ms ease, background 180ms ease;
    }

    .button:hover,
    .button:focus-visible {
      transform: translateY(-3px);
      box-shadow: 0 10px 22px rgba(117, 100, 217, 0.25);
      background: #6654ce;
    }

    .button.secondary {
      color: var(--accent);
      background: transparent;
    }

    .button.secondary:hover,
    .button.secondary:focus-visible {
      color: var(--white);
    }

    @media (max-width: 600px) {
      body {
        padding: 1rem;
      }

      .card {
        min-height: 600px;
        align-items: flex-start;
        padding: 3rem 1.7rem;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <section class="content" aria-labelledby="welcome-title">
      <p class="eyebrow">A little corner of the web</p>
      <h1 id="welcome-title">Hello, I’m <span>Saanvi</span>.</h1>
      <p class="intro">
        Welcome to my space on the internet. I’m learning, creating, and
        discovering something new every day.
      </p>
      <nav class="actions" aria-label="Main navigation">
        <a class="button" href="#about">Explore</a>
        <a class="button secondary" href="mailto:saanvi@example.com">Say hello</a>
      </nav>
    </section>
  </main>
</body>
</html>
